# Automatyczna publikacja gry na GitHub Pages po każdym pushu do gałęzi main.
# Jednorazowo: Settings → Pages → Build and deployment → Source: „GitHub Actions”.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # szybki test logiki (testy kalibracji z losowością uruchamiaj lokalnie: npm test)
      - run: node asset_src/online_test.mjs
      - run: node asset_src/accounts_test.mjs
      - run: node asset_src/update8_test.mjs
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
